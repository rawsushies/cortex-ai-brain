<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Cortex</title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Views">
    <a class="rail-mark" href="#/" title="Cortex" aria-label="Home"><img src="mark.svg" alt=""></a>
    <a href="#/" data-view="home" title="Home"><svg><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#/graph" data-view="graph" title="Graph"><svg><use href="#i-graph"/></svg><span>Graph</span></a>
    <a href="#/tasks" data-view="tasks" title="Tasks"><svg><use href="#i-check"/></svg><span>Tasks</span><b class="badge" id="taskCount"></b></a>
    <a href="#/topics" data-view="topics" title="Topics"><svg><use href="#i-topics"/></svg><span>Topics</span></a>
    <a href="#/conversations" data-view="conversations" title="Conversations"><svg><use href="#i-chat"/></svg><span>Chats</span></a>
    <a href="#/changes" data-view="changes" title="Changes and undo"><svg><use href="#i-undo"/></svg><span>Changes</span></a>
    <a href="#/activity" data-view="activity" title="AI activity"><svg><use href="#i-pulse"/></svg><span>Activity</span></a>
    <a href="#/research" data-view="research" title="Research"><svg><use href="#i-globe"/></svg><span>Research</span></a>
    <span class="rail-gap"></span>
    <a href="#/health" data-view="health" title="Health"><svg><use href="#i-heart"/></svg><span>Health</span></a>
    <a href="#/sync" data-view="sync" title="Sync and backup"><svg><use href="#i-cloud"/></svg><span>Sync</span></a>
    <a href="#/settings" data-view="settings" title="Organizing rules and settings"><svg><use href="#i-gear"/></svg><span>Settings</span></a>
  </nav>

  <aside class="explorer" id="explorer" aria-label="Notes">
    <div class="ex-head">
      <span class="wordmark">Cortex</span>
      <span class="ex-tools">
        <button class="icon-btn" id="newBtn" title="New note" aria-label="New note"><svg><use href="#i-new"/></svg></button>
        <button class="icon-btn" id="collapseBtn" title="Collapse folders" aria-label="Collapse folders"><svg><use href="#i-collapse"/></svg></button>
      </span>
    </div>
    <form class="capture" id="captureForm" autocomplete="off">
      <textarea id="captureInput" rows="1" placeholder="Tell Cortex anything…" aria-label="Store anything; Cortex files it"></textarea>
      <button class="icon-btn" aria-label="Store"><svg><use href="#i-enter"/></svg></button>
    </form>
    <button class="search-trigger" id="searchBtn"><svg><use href="#i-search"/></svg><span>Search</span><kbd>Ctrl K</kbd></button>
    <div class="seg" role="tablist" aria-label="Group notes by">
      <button role="tab" data-mode="folders" aria-selected="true">Folders</button>
      <button role="tab" data-mode="categories" aria-selected="false">Categories</button>
    </div>
    <div class="tree" id="tree"></div>
    <div class="ex-foot" id="sideFoot"></div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open views"></div>
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open notes"><svg><use href="#i-menu"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions" id="topActions"></div>
      <button class="icon-btn" id="ctxBtn" title="Side panel" aria-label="Toggle side panel"><svg><use href="#i-panel"/></svg></button>
    </header>
    <section class="view" id="view"></section>
  </main>

  <aside class="context" id="context" aria-label="Details"></aside>
</div>

<div class="palette-wrap" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search notes">
    <input id="paletteInput" placeholder="Search your brain, or type a new note name…" autocomplete="off" spellcheck="false">
    <ul id="paletteList" role="listbox"></ul>
    <div class="palette-hint"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button class="toast-act" id="toastAct" hidden></button></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2"/><circle cx="17.5" cy="6" r="2.2"/><circle cx="12" cy="17" r="2.6"/><path d="M8 8.2 10.6 15M15.8 7.6 13.2 14.8M8.2 7 15.3 6.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/></symbol>
    <symbol id="i-topics" viewBox="0 0 24 24"><circle cx="8" cy="9" r="4"/><circle cx="16.5" cy="9.5" r="3"/><circle cx="12" cy="16.5" r="3.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v6a2.5 2.5 0 0 1-2.5 2.5H11l-4 4v-4h0A2 2 0 0 1 5 13z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4.5 9.5 9 5"/><path d="M5 9.5h9a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3.5 12h4l2-5 4 10 2-5h5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.4 2.4 3.4 5 3.4 8s-1 5.6-3.4 8c-2.4-2.4-3.4-5-3.4-8S9.6 6.4 12 4z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19s-7-4.3-7-9.2A3.8 3.8 0 0 1 12 7.6a3.8 3.8 0 0 1 7 2.2C19 14.7 12 19 12 19z"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5a4 4 0 0 1-.6-8 5.5 5.5 0 0 1 10.6 1.5 3.3 3.3 0 0 1-.5 6.5z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M13.5 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5z"/><path d="M12 11v6M9 14h6"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></symbol>
    <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19 5v6a3 3 0 0 1-3 3H6"/><path d="m9.5 10.5-3.5 3.5 3.5 3.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m19.5 19.5-4.2-4.2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M14.5 5v14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6H10l2 2h6.5A1.5 1.5 0 0 1 20 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 4H7.5A1.5 1.5 0 0 0 6 5.5v13A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V8.5z"/><path d="M13.5 4v4.5H18"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
  </defs>
</svg>

<script src="app.js"></script>
</body>
</html>
