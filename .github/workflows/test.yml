name: Tests (Linux, with two Syncthing peers)

# The full suite on Linux, including the live multi-device tests: two real Syncthing instances on
# one runner, each with its own vault copy and Cortex index (tests/test_syncthing_pair.py).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORTEX_SEMANTIC: "off"
      CORTEX_REQUIRE_SYNCTHING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Syncthing
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q syncthing
          syncthing --version

      - name: Run the test suite
        run: python -m unittest discover tests -v
